[theme]
base = "dark"
primaryColor = "#10a37f"
backgroundColor = "#212121"
secondaryBackgroundColor = "#171717"
textColor = "#ececec"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
# Any uncaught exception renders as a generic message instead of a full
# traceback — a traceback exposes local file paths (e.g. C:\Users\<name>\...)
# directly in the chat UI, which is not something to show a student.
showErrorDetails = "none"
